<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soumyajit's AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --light-bg: #f5f7fa;
            --dark-bg: #0f0f1e;
            --card-light: rgba(255, 255, 255, 0.7);
            --card-dark: rgba(20, 20, 35, 0.8);
            --text-light: #1a1a2e;
            --text-dark: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--light-bg) 0%, #e9ecef 100%);
            color: var(--text-light);
            transition: all 0.3s ease;
        }

        body.dark-mode {
            background: linear-gradient(135deg, var(--dark-bg) 0%, #1a1a2e 100%);
            color: var(--text-dark);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            margin-bottom: 20px;
            background: var(--card-light);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        body.dark-mode .header {
            background: var(--card-dark);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toggle-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            background: transparent;
            color: var(--primary);
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .toggle-btn:hover {
            background: var(--primary);
            color: white;
            transform: scale(1.1);
        }

        .chat-box {
            background: var(--card-light);
            border-radius: 15px;
            padding: 20px;
            height: 600px;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
        }

        body.dark-mode .chat-box {
            background: var(--card-dark);
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 20px;
            padding-right: 10px;
        }

        .messages::-webkit-scrollbar {
            width: 6px;
        }

        .messages::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        .message {
            margin-bottom: 15px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            display: flex;
            justify-content: flex-end;
        }

        .message.ai {
            display: flex;
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 15px;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.5;
        }

        .user .message-content {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }

        .ai .message-content {
            background: rgba(102, 126, 234, 0.1);
            color: var(--text-light);
            border: 1px solid var(--primary);
        }

        body.dark-mode .ai .message-content {
            background: rgba(102, 126, 234, 0.2);
            color: var(--text-dark);
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        .input-field {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid var(--primary);
            border-radius: 20px;
            font-size: 14px;
            background: transparent;
            color: var(--text-light);
            font-family: inherit;
            transition: all 0.3s ease;
        }

        body.dark-mode .input-field {
            color: var(--text-dark);
        }

        .input-field:focus {
            outline: none;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.2);
        }

        .input-field::placeholder {
            color: rgba(26, 26, 46, 0.5);
        }

        .send-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .send-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        .typing {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary);
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
            30% { opacity: 1; transform: translateY(-10px); }
        }

        @media (max-width: 768px) {
            .chat-box {
                height: 500px;
            }

            .message-content {
                max-width: 85%;
            }

            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <i class="fas fa-brain"></i>
                Soumyajit's AI
            </div>
            <button class="toggle-btn" id="themeBtn">
                <i class="fas fa-moon"></i>
            </button>
        </div>

        <div class="chat-box">
            <div class="messages" id="messages">
                <div class="message ai">
                    <div class="message-content">
                        <strong>Welcome!</strong> 👋 How can I assist you today?
                    </div>
                </div>
            </div>

            <div class="input-area">
                <input 
                    type="text" 
                    class="input-field" 
                    id="input" 
                    placeholder="Type your message..." 
                    autocomplete="off"
                >
                <button class="send-btn" id="sendBtn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        const messagesDiv = document.getElementById('messages');
        const inputField = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');
        const themeBtn = document.getElementById('themeBtn');

        // Theme
        const isDark = localStorage.getItem('dark') === 'true';
        if (isDark) {
            document.body.classList.add('dark-mode');
            themeBtn.innerHTML = '<i class="fas fa-sun"></i>';
        }

        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const dark = document.body.classList.contains('dark-mode');
            localStorage.setItem('dark', dark);
            themeBtn.innerHTML = dark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        });

        // Send message
        async function sendMessage() {
            const text = inputField.value.trim();
            if (!text) return;

            // Show user message
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.innerHTML = `<div class="message-content">${text}</div>`;
            messagesDiv.appendChild(userMsg);
            inputField.value = '';

            // Show typing
            const typingMsg = document.createElement('div');
            typingMsg.className = 'message ai';
            typingMsg.id = 'typing';
            typingMsg.innerHTML = `<div class="message-content"><div class="typing"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>`;
            messagesDiv.appendChild(typingMsg);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            try {
                // Send to server
                const response = await fetch('/api/webhook', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();

                // Remove typing
                document.getElementById('typing').remove();

                // Show AI response
                const aiMsg = document.createElement('div');
                aiMsg.className = 'message ai';
                
                // Extract response text from n8n
                let responseText = data.response || data.message || data.text || JSON.stringify(data);
                aiMsg.innerHTML = `<div class="message-content">${responseText}</div>`;
                messagesDiv.appendChild(aiMsg);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;

            } catch (error) {
                console.error(error);
                document.getElementById('typing').remove();
                const errMsg = document.createElement('div');
                errMsg.className = 'message ai';
                errMsg.innerHTML = `<div class="message-content">⚠️ Error: ${error.message}</div>`;
                messagesDiv.appendChild(errMsg);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }
        }

        // Events
        sendBtn.addEventListener('click', sendMessage);
        inputField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
