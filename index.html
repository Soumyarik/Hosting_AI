<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Soumyajit's AI</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #1e3a8a, #020617 45%, #000 100%);
    }

    .glass {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .typing span {
      width: 8px;
      height: 8px;
      background: cyan;
      border-radius: 50%;
      display: inline-block;
      animation: bounce 1s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes bounce {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
  </style>
</head>

<body class="text-white">

<div class="h-screen flex flex-col">

  <header class="glass p-4 flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold">Soumyajit's AI</h1>
      <p class="text-sm text-gray-400">Your Personal AI Assistant</p>
    </div>

    <button id="themeBtn" class="glass px-4 py-2 rounded-xl">
      🌙
    </button>
  </header>

  <main class="flex-1 max-w-6xl mx-auto w-full p-4 flex flex-col overflow-hidden">

    <div class="text-center mb-6">
      <h2 class="text-5xl font-bold bg-gradient-to-r from-cyan-400 via-blue-500 to-indigo-500 bg-clip-text text-transparent">
        Welcome to Soumyajit's AI
      </h2>

      <p class="text-gray-400 mt-3">
        Chat like ChatGPT with your own AI assistant.
      </p>
    </div>

    <div id="chatBox" class="flex-1 overflow-y-auto glass rounded-3xl p-6 space-y-5">

      <div class="flex justify-start">
        <div class="glass px-5 py-4 rounded-3xl max-w-[80%]">
          👋 Hi! I'm Soumyajit's AI Assistant. How can I help you today?
        </div>
      </div>

    </div>

    <div class="glass rounded-3xl p-4 mt-5">

      <textarea
        id="userInput"
        rows="3"
        placeholder="Message Soumyajit's AI..."
        class="w-full rounded-3xl bg-black/30 border border-white/10 p-4 outline-none resize-none"
      ></textarea>

      <div class="flex flex-wrap items-center justify-between gap-3 mt-4">

        <div class="flex flex-wrap gap-3">

          <label class="glass px-4 py-3 rounded-2xl cursor-pointer">
            📷 Upload
            <input type="file" hidden>
          </label>

          <label class="glass px-4 py-3 rounded-2xl cursor-pointer">
            📄 File
            <input type="file" hidden>
          </label>

          <button class="glass px-4 py-3 rounded-2xl">
            🎤 Voice
          </button>

        </div>

        <button
          id="sendBtn"
          class="px-6 py-3 rounded-2xl bg-gradient-to-r from-cyan-500 via-blue-500 to-indigo-600"
        >
          Send ➜
        </button>

      </div>

    </div>

  </main>

</div>

<script>

const sendBtn = document.getElementById('sendBtn');
const userInput = document.getElementById('userInput');
const chatBox = document.getElementById('chatBox');

function addMessage(message, type='bot') {

  const wrapper = document.createElement('div');

  wrapper.className =
    `flex ${type === 'user' ? 'justify-end' : 'justify-start'}`;

  const bubble = document.createElement('div');

  bubble.className =
    type === 'user'
    ? 'px-5 py-4 rounded-3xl bg-cyan-600 max-w-[80%]'
    : 'glass px-5 py-4 rounded-3xl max-w-[80%]';

  bubble.innerText = message;

  wrapper.appendChild(bubble);

  chatBox.appendChild(wrapper);

  chatBox.scrollTop = chatBox.scrollHeight;
}

async function sendMessage() {

  const message = userInput.value.trim();

  if(!message) return;

  addMessage(message,'user');

  userInput.value = '';

  const loading = document.createElement('div');

  loading.className = 'flex justify-start';

  loading.innerHTML = `
    <div class="glass px-5 py-4 rounded-3xl flex items-center gap-3">
      <div class="typing flex gap-1">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <span>Soumyajit's AI is thinking...</span>
    </div>
  `;

  chatBox.appendChild(loading);

  chatBox.scrollTop = chatBox.scrollHeight;

  try {

    const response = await fetch('/chat', {
      method:'POST',
      headers:{
        'Content-Type':'application/json'
      },
      body:JSON.stringify({
        message
      })
    });

    const text = await response.text();

    console.log('RAW RESPONSE:', text);

    loading.remove();

    if(!text || text.trim() === ''){

      addMessage('⚠️ Empty response from AI');

      return;
    }

    const data = JSON.parse(text);

    console.log('PARSED DATA:', data);

    addMessage(
      data.reply ||
      data.output ||
      data.response ||
      data.message ||
      data[0]?.output ||
      '⚠️ No response'
    );

  } catch(error) {

    console.error('FETCH ERROR:', error);

    loading.remove();

    addMessage('⚠️ Error connecting AI');

  }

}

sendBtn.addEventListener('click', sendMessage);

userInput.addEventListener('keydown', (e)=>{

  if(e.key === 'Enter' && !e.shiftKey){

    e.preventDefault();

    sendMessage();

  }

});

</script>

</body>
</html>
