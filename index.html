<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soumyajit's AI</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Inter',sans-serif;
      background:#0f1117;
      color:white;
      height:100vh;
      display:flex;
      flex-direction:column;
    }

    header{
      padding:18px 24px;
      border-bottom:1px solid rgba(255,255,255,0.08);
      display:flex;
      align-items:center;
      justify-content:space-between;
      background:#111827;
    }

    .logo{
      font-size:20px;
      font-weight:700;
    }

    .status{
      font-size:13px;
      color:#4ade80;
    }

    #messages{
      flex:1;
      overflow-y:auto;
      padding:20px;
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    .message{
      max-width:800px;
      width:fit-content;
      padding:14px 18px;
      border-radius:14px;
      line-height:1.6;
      white-space:pre-wrap;
      word-wrap:break-word;
    }

    .user{
      align-self:flex-end;
      background:linear-gradient(135deg,#7c3aed,#2563eb);
    }

    .bot{
      align-self:flex-start;
      background:#1f2937;
      border:1px solid rgba(255,255,255,0.08);
    }

    .input-area{
      padding:18px;
      border-top:1px solid rgba(255,255,255,0.08);
      background:#111827;
    }

    .input-box{
      max-width:900px;
      margin:auto;
      display:flex;
      gap:12px;
      align-items:flex-end;
    }

    textarea{
      flex:1;
      resize:none;
      border:none;
      outline:none;
      background:#1f2937;
      color:white;
      padding:14px;
      border-radius:12px;
      min-height:56px;
      max-height:160px;
      font-size:15px;
      font-family:'Inter',sans-serif;
    }

    button{
      border:none;
      outline:none;
      cursor:pointer;
      padding:14px 18px;
      border-radius:12px;
      background:linear-gradient(135deg,#7c3aed,#2563eb);
      color:white;
      font-weight:600;
      font-size:14px;
    }

    button:hover{
      opacity:0.9;
    }

    .typing{
      display:flex;
      gap:6px;
      padding:12px 16px;
      background:#1f2937;
      width:fit-content;
      border-radius:12px;
    }

    .typing span{
      width:8px;
      height:8px;
      border-radius:50%;
      background:white;
      animation:bounce 1s infinite;
    }

    .typing span:nth-child(2){
      animation-delay:0.2s;
    }

    .typing span:nth-child(3){
      animation-delay:0.4s;
    }

    @keyframes bounce{
      0%,80%,100%{
        transform:translateY(0);
        opacity:0.5;
      }
      40%{
        transform:translateY(-6px);
        opacity:1;
      }
    }

    @media(max-width:700px){
      #messages{
        padding:14px;
      }

      .message{
        max-width:100%;
      }

      .input-area{
        padding:12px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">✦ Soumyajit's AI</div>
  <div class="status">● Online</div>
</header>

<div id="messages">
  <div class="message bot">
    Hey 👋 I'm Soumyajit's AI assistant. Ask me anything.
  </div>
</div>

<div class="input-area">
  <div class="input-box">
    <textarea
      id="input"
      placeholder="Ask anything..."
      rows="1"
    ></textarea>

    <button onclick="sendMessage()">
      Send
    </button>
  </div>
</div>

<script>

const WEBHOOK_URL = "https://n8n-production-a9be2.up.railway.app/webhook/bde39fec-3dc5-48bd-95d3-9b7402ae703b";

const messages = document.getElementById("messages");
const input = document.getElementById("input");

input.addEventListener("keydown", function(e){
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

input.addEventListener("input", function(){
  this.style.height = "auto";
  this.style.height = this.scrollHeight + "px";
});

function addMessage(text, type){

  const div = document.createElement("div");
  div.className = `message ${type}`;
  div.textContent = text;

  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;

  return div;
}

function showTyping(){

  const div = document.createElement("div");
  div.className = "typing";
  div.id = "typing";

  div.innerHTML = `
    <span></span>
    <span></span>
    <span></span>
  `;

  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function removeTyping(){
  const typing = document.getElementById("typing");
  if(typing) typing.remove();
}

async function sendMessage(){

  const text = input.value.trim();

  if(!text) return;

  addMessage(text, "user");

  input.value = "";
  input.style.height = "56px";

  showTyping();

  try{

    const response = await fetch(WEBHOOK_URL,{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        message:text,
        chatInput:text,
        sessionId:"soumyajit-user"
      })
    });

    const data = await response.json();

    removeTyping();

    const reply =
      data.output ||
      data.response ||
      data.message ||
      data.text ||
      JSON.stringify(data);

    addMessage(reply,"bot");

  }catch(error){

    removeTyping();

    addMessage(
      "⚠️ Unable to connect with AI server.",
      "bot"
    );

    console.error(error);
  }
}

</script>

</body>
</html>
