<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soumyajit's AI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b1020;
color:white;
height:100vh;
display:flex;
flex-direction:column;
overflow:hidden;
}

header{
padding:18px 24px;
background:#111827;
border-bottom:1px solid rgba(255,255,255,0.08);
font-size:22px;
font-weight:bold;
}

.container{
display:flex;
flex:1;
overflow:hidden;
}

.sidebar{
width:300px;
background:#111827;
padding:20px;
border-right:1px solid rgba(255,255,255,0.08);
overflow-y:auto;
}

.sidebar h2{
margin-bottom:14px;
font-size:22px;
}

.sidebar p{
color:#cbd5e1;
line-height:1.6;
margin-bottom:20px;
}

.feature{
background:#1e293b;
padding:14px;
border-radius:12px;
margin-bottom:12px;
transition:0.3s;
}

.feature:hover{
background:#2563eb;
transform:translateX(5px);
}

.chat-area{
flex:1;
display:flex;
flex-direction:column;
}

.messages{
flex:1;
overflow-y:auto;
padding:20px;
display:flex;
flex-direction:column;
gap:16px;
}

.message{
max-width:75%;
padding:14px 18px;
border-radius:16px;
line-height:1.6;
word-wrap:break-word;
}

.user{
align-self:flex-end;
background:#2563eb;
}

.bot{
align-self:flex-start;
background:#1e293b;
}

.bot img{
max-width:350px;
border-radius:14px;
margin-top:12px;
display:block;
}

.input-area{
display:flex;
gap:10px;
padding:20px;
border-top:1px solid rgba(255,255,255,0.08);
background:#111827;
}

textarea{
flex:1;
height:60px;
resize:none;
border:none;
outline:none;
padding:16px;
border-radius:14px;
background:#1e293b;
color:white;
font-size:16px;
}

button{
width:60px;
border:none;
border-radius:14px;
background:#7c3aed;
color:white;
font-size:20px;
cursor:pointer;
}

.typing{
opacity:0.7;
font-style:italic;
}

@media(max-width:900px){

.container{
flex-direction:column;
}

.sidebar{
width:100%;
}

.message{
max-width:90%;
}

}

</style>
</head>

<body>

<header>
Soumyajit's AI 🚀
</header>

<div class="container">

<div class="sidebar">

<h2>🚀 AI Capabilities</h2>

<p>
This AI assistant is currently under active development.
New intelligent tools and automation features are continuously being added.
</p>

<div class="feature">🌤️ Weather Reports</div>
<div class="feature">🧮 Calculations & Math Solving</div>
<div class="feature">🎨 AI Image Creation</div>
<div class="feature">🔎 Smart Search Engine</div>

</div>

<div class="chat-area">

<div class="messages" id="messages">

<div class="message bot">
Hello 👋 How can I help you today?
</div>

</div>

<div class="input-area">

<textarea 
id="input"
placeholder="Ask me anything..."
></textarea>

<button onclick="sendMessage()">➤</button>

</div>

</div>

</div>

<script>

const webhookUrl = "PASTE_YOUR_N8N_WEBHOOK";

let isTyping = false;

const messages = document.getElementById("messages");

const input = document.getElementById("input");


// NORMAL MESSAGE
function addMessage(role,text){

const div=document.createElement("div");

div.className=`message ${role}`;

div.innerHTML=text;

messages.appendChild(div);

messages.scrollTop=messages.scrollHeight;

}


// IMAGE MESSAGE
function addImageMessage(role,text,imageUrl){

const div=document.createElement("div");

div.className=`message ${role}`;

div.innerHTML=`
<div>${text}</div>

<img src="${imageUrl}" />
`;

messages.appendChild(div);

messages.scrollTop=messages.scrollHeight;

}


// TYPING
function showTyping(){

const div=document.createElement("div");

div.className="message bot typing";

div.id="typing";

div.innerHTML="AI is thinking...";

messages.appendChild(div);

messages.scrollTop=messages.scrollHeight;

}


function removeTyping(){

const typing=document.getElementById("typing");

if(typing){
typing.remove();
}

}


// SEND MESSAGE
async function sendMessage(){

const text=input.value.trim();

if(!text || isTyping) return;

isTyping=true;

addMessage("user",text);

input.value="";

showTyping();

try{

const response=await fetch(webhookUrl,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
message:text,
chatInput:text
})

});


removeTyping();


// HANDLE DIRECT IMAGE RESPONSE
const contentType=response.headers.get("content-type");


if(contentType && contentType.startsWith("image/")){

const blob=await response.blob();

const imageUrl=URL.createObjectURL(blob);

addImageMessage(
"bot",
"Here is your generated image ✨",
imageUrl
);

}


// HANDLE JSON RESPONSE
else{

const data=await response.json();

const imageUrl=
data?.image ||
data?.imageUrl ||
data?.url ||
data?.output?.image;


const reply=
data?.output ||
data?.text ||
data?.message ||
data?.response ||
data?.reply ||
"Done!";


// IF JSON HAS IMAGE
if(imageUrl){

addImageMessage(
"bot",
reply,
imageUrl
);

}


// NORMAL TEXT
else{

addMessage(
"bot",
reply
);

}

}

}catch(err){

removeTyping();

addMessage(
"bot",
"⚠️ Could not connect to n8n webhook."
);

console.log(err);

}

isTyping=false;

}


// ENTER TO SEND
input.addEventListener("keypress",function(e){

if(e.key==="Enter" && !e.shiftKey){

e.preventDefault();

sendMessage();

}

});

</script>

</body>
</html>
